<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 360" role="img" aria-labelledby="title"><title id="title">Content sources → one developer website</title><rect width="1110" height="360" rx="16" fill="#f3f8f5"/><g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#233b34"><text x="24" y="55" font-size="28" font-weight="700">Content sources → one developer website</text><rect x="24" y="100" width="330" height="220" rx="12" fill="white" stroke="#c6dad4"/><text x="44" y="140" fill="#006f59" font-size="24" font-weight="700">mo-docs</text><text x="44" y="185" font-size="17">docs/ · Markdown and controlled MDX</text><text x="44" y="221" font-size="17">hardware/ · facts, design files, training</text><text x="44" y="257" font-size="17">static/ · media and evidence</text><path d="M360 210h20m-7-6 7 6-7 6" fill="none" stroke="#006f59" stroke-width="2"/><rect x="386" y="100" width="330" height="220" rx="12" fill="white" stroke="#c6dad4"/><text x="406" y="140" fill="#006f59" font-size="24" font-weight="700">developer integration</text><text x="406" y="185" font-size="17">Fixed source commits and file hashes</text><text x="406" y="221" font-size="17">Content contract and route mapping</text><text x="406" y="257" font-size="17">Generated pages and compatibility paths</text><path d="M722 210h20m-7-6 7 6-7 6" fill="none" stroke="#006f59" stroke-width="2"/><rect x="748" y="100" width="330" height="220" rx="12" fill="white" stroke="#c6dad4"/><text x="768" y="140" fill="#006f59" font-size="24" font-weight="700">One Docusaurus website</text><text x="768" y="185" font-size="17">Components, navigation and search</text><text x="768" y="221" font-size="17">Integrated preview and browser checks</text><text x="768" y="257" font-size="17">Complete site release and rollback</text></g></svg>
