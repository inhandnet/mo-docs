<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1104" role="img" aria-labelledby="title description">
<title id="title">mo-docs: from verified content to a published site</title><desc id="description">Maintain guides and evidence in source; review data updates explicitly</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#769095"/></marker></defs>
<rect width="1120" height="1104" rx="16" fill="#f4f8f7"/>
<g font-family="Inter, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif"><text x="40" y="42" font-size="13" fill="#006f59" font-weight="700">MO / DOCUMENTATION</text><text x="40" y="92" font-size="29" fill="#172d31" font-weight="700">mo-docs: from verified content to a published site</text><text x="40" y="124" font-size="17" fill="#53686d" font-weight="400">Maintain guides and evidence in source; review data updates explicitly</text><rect x="24" y="150" width="1072" height="392" rx="16" fill="#edf3f2" stroke="#dce6e4"/><rect x="40" y="166" width="504" height="160" rx="12" fill="#fff" stroke="#cad9d9"/><text x="64" y="208" font-size="23" fill="#172d31" font-weight="700">01  Content and evidence</text><text x="64" y="251" font-size="18" fill="#172d31" font-weight="400">docs/mo-* · shared partials · security</text><text x="64" y="288" font-size="18" fill="#53686d" font-weight="400">Board, image, commands, results and limits</text><rect x="576" y="166" width="504" height="160" rx="12" fill="#fff" stroke="#cad9d9"/><text x="600" y="208" font-size="23" fill="#172d31" font-weight="700">02  Public assets</text><text x="600" y="251" font-size="18" fill="#172d31" font-weight="400">static/img · static/downloads</text><text x="600" y="288" font-size="18" fill="#53686d" font-weight="400">Captures, licensed media, examples, evidence</text><rect x="40" y="366" width="504" height="160" rx="12" fill="#fff" stroke="#cad9d9"/><text x="64" y="408" font-size="23" fill="#172d31" font-weight="700">03  Data and upstream resources</text><text x="64" y="451" font-size="18" fill="#172d31" font-weight="400">GitHub Release snapshot · source links</text><text x="64" y="488" font-size="18" fill="#53686d" font-weight="400">Browser resolves a stable image/checksum pair</text><rect x="576" y="366" width="504" height="160" rx="12" fill="#fff" stroke="#cad9d9"/><text x="600" y="408" font-size="23" fill="#172d31" font-weight="700">04  Shared documentation UI</text><text x="600" y="451" font-size="18" fill="#172d31" font-weight="400">Route links · tables · downloads · search</text><text x="600" y="488" font-size="18" fill="#53686d" font-weight="400">33 hardware redirects keep query and fragment</text><rect x="40" y="600" width="1040" height="160" rx="12" fill="#e7f3ee" stroke="#cad9d9"/><text x="64" y="642" font-size="23" fill="#172d31" font-weight="700">05  Docusaurus + Pagefind</text><text x="64" y="685" font-size="18" fill="#172d31" font-weight="400">Config, theme and target URLs → static pages</text><text x="64" y="722" font-size="18" fill="#53686d" font-weight="400">Local index · font notices · deployment marker</text><rect x="40" y="800" width="1040" height="160" rx="12" fill="#e7f3ee" stroke="#cad9d9"/><text x="64" y="842" font-size="23" fill="#172d31" font-weight="700">06  Validation and delivery</text><text x="64" y="885" font-size="18" fill="#172d31" font-weight="400">Unit tests · type checks · browser and layout</text><text x="64" y="922" font-size="18" fill="#53686d" font-weight="400">Review artifacts / Pages / release archives</text><path d="M560 546 V596" fill="none" stroke="#769095" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 764 V796" fill="none" stroke="#769095" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="1004" font-size="14" fill="#006f59" font-weight="700">INDEPENDENT DEPLOYMENT</text><text x="40" y="1038" font-size="19" fill="#172d31" font-weight="400">/docs/ is built and deployed separately from / and /hardware-docs/.</text><text x="40" y="1073" font-size="17" fill="#53686d" font-weight="400">Normal builds do not refresh release data; board observations remain scoped evidence.</text></g></svg>
