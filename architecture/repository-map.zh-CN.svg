<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1070" role="img" aria-labelledby="title description">
<title id="title">一个开发者平台，共用仓库与产品仓库协同</title><desc id="description">Mo 系列共用框架 · 内容各自维护，独立构建与发布. 来源仓库发布新版本，不会自动触发网站重新构建。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#769095"/></marker></defs>
<rect width="1120" height="1070" rx="16" fill="#f4f8f7"/>
<g font-family="Inter, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif"><text x="40" y="42" font-size="13" fill="#006f59" font-weight="700">MO / DEVELOPER PLATFORM</text><text x="40" y="92" font-size="30" fill="#172d31" font-weight="700">一个开发者平台，共用仓库与产品仓库协同</text><text x="40" y="124" font-size="17" fill="#53686d" font-weight="400">Mo 系列共用框架 · 内容各自维护，独立构建与发布</text><text x="40" y="178" font-size="15" fill="#006f59" font-weight="700">01  构成网站的三个仓库</text><text x="720" y="178" font-size="16" fill="#53686d" font-weight="400">三份构建产物，通过同一域名访问</text><rect x="40" y="202" width="328" height="220" rx="12" fill="#fff" stroke="#cad9d9"/><text x="62" y="242" font-size="26" fill="#172d31" font-weight="700">developer</text><text x="62" y="270" font-size="15" fill="#53686d" font-weight="400">GitLab · 主站框架与统一入口</text><rect x="62" y="289" width="284" height="36" rx="6" fill="#f2f6f5" stroke="#dbe6e2"/><text x="74" y="314" font-size="19" fill="#006f59" font-weight="600">/</text><text x="62" y="359" font-size="16" fill="#172d31" font-weight="400">产品介绍、主站导航与资源入口</text><text x="62" y="387" font-size="16" fill="#172d31" font-weight="400">软件、社区、博客与联系页面</text><rect x="396" y="202" width="328" height="220" rx="12" fill="#e7f3ee" stroke="#cad9d9"/><text x="418" y="242" font-size="26" fill="#172d31" font-weight="700">mo-docs</text><text x="418" y="270" font-size="15" fill="#53686d" font-weight="400">GitHub · 软件文档</text><rect x="418" y="289" width="284" height="36" rx="6" fill="#f2f6f5" stroke="#dbe6e2"/><text x="430" y="314" font-size="19" fill="#006f59" font-weight="600">/docs/</text><text x="418" y="359" font-size="16" fill="#172d31" font-weight="400">入门、系统使用与 AI 开发指南</text><text x="418" y="387" font-size="16" fill="#172d31" font-weight="400">模型、工具链与示例使用说明</text><rect x="752" y="202" width="328" height="220" rx="12" fill="#fff" stroke="#cad9d9"/><text x="774" y="242" font-size="26" fill="#172d31" font-weight="700">mo-hardware</text><text x="774" y="270" font-size="15" fill="#53686d" font-weight="400">GitHub · 硬件资料</text><rect x="774" y="289" width="284" height="36" rx="6" fill="#f2f6f5" stroke="#dbe6e2"/><text x="786" y="314" font-size="19" fill="#006f59" font-weight="600">/hardware-docs/</text><text x="774" y="359" font-size="16" fill="#172d31" font-weight="400">接口、原理图与机械资料</text><text x="774" y="387" font-size="16" fill="#172d31" font-weight="400">配件与合规文档</text><path d="M204 486 V426" fill="none" stroke="#769095" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 486 V426" fill="none" stroke="#769095" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="486" width="1040" height="84" rx="12" fill="#eaf0f4" stroke="#cad9df"/><text x="64" y="520" font-size="21" fill="#172d31" font-weight="600">链接、经审阅的快照与浏览器镜像查询</text><text x="64" y="548" font-size="16" fill="#53686d" font-weight="400">来源仓库发布新版本，不会自动触发网站重新构建。</text><text x="40" y="600" font-size="15" fill="#006f59" font-weight="700">02  BSP、工具、模型与示例仓库</text><text x="687" y="600" font-size="16" fill="#53686d" font-weight="400">各有独立版本 · 不部署网站页面</text><path d="M164 616 H956" fill="none" stroke="#769095" stroke-width="2"/><path d="M560 616 V574" fill="none" stroke="#769095" stroke-width="2" marker-end="url(#arrow)"/><path d="M164 616 V636" fill="none" stroke="#769095" stroke-width="2"/><rect x="40" y="640" width="248" height="174" rx="12" fill="#fff" stroke="#cad9d9"/><text x="56" y="675" font-size="23" fill="#172d31" font-weight="700">Mo*</text><text x="56" y="706" font-size="18" fill="#006f59" font-weight="600">BSP 与系统镜像</text><text x="56" y="752" font-size="16" fill="#172d31" font-weight="400">每个产品型号独立维护仓库</text><text x="56" y="779" font-size="16" fill="#172d31" font-weight="400">Mo62A / Mo68A / …</text><path d="M428 616 V636" fill="none" stroke="#769095" stroke-width="2"/><rect x="304" y="640" width="248" height="174" rx="12" fill="#fff" stroke="#cad9d9"/><text x="320" y="675" font-size="23" fill="#172d31" font-weight="700">mo-models</text><text x="320" y="706" font-size="18" fill="#006f59" font-weight="600">模型清单</text><text x="320" y="752" font-size="16" fill="#172d31" font-weight="400">元数据与 .link 下载引用</text><text x="320" y="779" font-size="16" fill="#172d31" font-weight="400">编译方法、基准与实测记录</text><path d="M692 616 V636" fill="none" stroke="#769095" stroke-width="2"/><rect x="568" y="640" width="248" height="174" rx="12" fill="#fff" stroke="#cad9d9"/><text x="584" y="675" font-size="23" fill="#172d31" font-weight="700">mo-tools</text><text x="584" y="706" font-size="18" fill="#006f59" font-weight="600">开发与测试工具</text><text x="584" y="752" font-size="16" fill="#172d31" font-weight="400">工具链版本约定</text><text x="584" y="779" font-size="16" fill="#172d31" font-weight="400">主机环境配置与板测工具</text><path d="M956 616 V636" fill="none" stroke="#769095" stroke-width="2"/><rect x="832" y="640" width="248" height="174" rx="12" fill="#fff" stroke="#cad9d9"/><text x="848" y="675" font-size="23" fill="#172d31" font-weight="700">mo-examples</text><text x="848" y="706" font-size="18" fill="#006f59" font-weight="600">应用示例</text><text x="848" y="752" font-size="16" fill="#172d31" font-weight="400">AI 与相机示例源码</text><text x="848" y="779" font-size="16" fill="#172d31" font-weight="400">教程配套的可运行程序</text><rect x="40" y="838" width="1040" height="86" rx="12" fill="#f1f0f8" stroke="#d9d5e9"/><text x="60" y="865" font-size="12" fill="#63557c" font-weight="700">上游来源</text><text x="190" y="866" font-size="19" fill="#172d31" font-weight="600">TI 模型库与工具链下载</text><text x="190" y="899" font-size="16" fill="#53686d" font-weight="400">mo-models、mo-tools 引用上游发布物；模型二进制不放进 Git。</text><path d="M40 950 H1080" fill="none" stroke="#769095" stroke-width="2"/><text x="40" y="979" font-size="12" fill="#006f59" font-weight="700">部署环境</text><text x="40" y="1009" font-size="18" fill="#172d31" font-weight="500">测试  developer.inhand.online     /     正式目标  developer.inhand.com</text><text x="40" y="1042" font-size="15" fill="#53686d" font-weight="400">各仓库独立管理版本，通过链接与经审查的数据快照协同。</text></g></svg>
