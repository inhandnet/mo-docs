<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 654" role="img" aria-labelledby="title description">
<title id="title">mo-docs 如何发布到网站</title><desc id="description">GitHub 流程 · 测试与正式分别构建 · Release 发布成功后部署. 测试与正式域名分别构建；校验失败或缺少配置时阻断相应发布、部署步骤。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#769095"/></marker></defs>
<rect width="1120" height="654" rx="16" fill="#f4f8f7"/>
<g font-family="Inter, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif"><text x="40" y="42" font-size="13" fill="#006f59" font-weight="700">MO / DELIVERY</text><text x="40" y="90" font-size="30" fill="#172d31" font-weight="700">mo-docs 如何发布到网站</text><text x="40" y="124" font-size="17" fill="#53686d" font-weight="400">GitHub 流程 · 测试与正式分别构建 · Release 发布成功后部署</text><rect x="40" y="164" width="248" height="156" rx="12" fill="#fff" stroke="#cad9d9"/><rect x="58" y="182" width="30" height="30" rx="8" fill="#e7f3ee" stroke="#e7f3ee"/><text x="68" y="204" font-size="18" fill="#006f59" font-weight="700">1</text><text x="58" y="245" font-size="22" fill="#172d31" font-weight="700">合并请求 PR</text><text x="58" y="274" font-size="16" fill="#172d31" font-weight="400">英文提交信息</text><text x="58" y="300" font-size="16" fill="#172d31" font-weight="400">规范检查、测试与构建</text><path d="M288 237 h12" fill="none" stroke="#769095" stroke-width="2" marker-end="url(#arrow)"/><rect x="304" y="164" width="248" height="156" rx="12" fill="#fff" stroke="#cad9d9"/><rect x="322" y="182" width="30" height="30" rx="8" fill="#e7f3ee" stroke="#e7f3ee"/><text x="332" y="204" font-size="18" fill="#006f59" font-weight="700">2</text><text x="322" y="245" font-size="22" fill="#172d31" font-weight="700">受保护的 master</text><text x="322" y="274" font-size="16" fill="#172d31" font-weight="400">Admin 合并</text><text x="322" y="300" font-size="16" fill="#172d31" font-weight="400">生成 GitHub Pages 预览</text><path d="M552 237 h12" fill="none" stroke="#769095" stroke-width="2" marker-end="url(#arrow)"/><rect x="568" y="164" width="248" height="156" rx="12" fill="#fff" stroke="#cad9d9"/><rect x="586" y="182" width="30" height="30" rx="8" fill="#e7f3ee" stroke="#e7f3ee"/><text x="596" y="204" font-size="18" fill="#006f59" font-weight="700">3</text><text x="586" y="245" font-size="22" fill="#172d31" font-weight="700">标签与发布校验</text><text x="586" y="274" font-size="16" fill="#172d31" font-weight="400">VX.Y.Z-rcN / VX.Y.Z</text><text x="586" y="300" font-size="16" fill="#172d31" font-weight="400">Admin 推送后由 CI 校验</text><path d="M816 237 h12" fill="none" stroke="#769095" stroke-width="2" marker-end="url(#arrow)"/><rect x="832" y="164" width="248" height="156" rx="12" fill="#fff" stroke="#cad9d9"/><rect x="850" y="182" width="30" height="30" rx="8" fill="#e7f3ee" stroke="#e7f3ee"/><text x="860" y="204" font-size="18" fill="#006f59" font-weight="700">4</text><text x="850" y="245" font-size="22" fill="#172d31" font-weight="700">构建与 Release</text><text x="850" y="274" font-size="16" fill="#172d31" font-weight="400">中英标题 · 英文变更条目</text><text x="850" y="300" font-size="16" fill="#172d31" font-weight="400">环境归档与 SHA256</text><path d="M956 320 V350 H292 V386" fill="none" stroke="#769095" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="390" width="504" height="126" rx="12" fill="#e7f3ee" stroke="#cad9d9"/><text x="64" y="425" font-size="23" fill="#172d31" font-weight="700">测试平台</text><text x="64" y="459" font-size="17" fill="#53686d" font-weight="400">每个发布标签均部署</text><text x="64" y="490" font-size="21" fill="#006f59" font-weight="500">developer.inhand.online</text><rect x="576" y="390" width="504" height="126" rx="12" fill="#fff" stroke="#cad9d9"/><text x="600" y="425" font-size="23" fill="#172d31" font-weight="700">正式平台目标</text><text x="600" y="459" font-size="17" fill="#53686d" font-weight="400">仅正式 VX.Y.Z · 需配置部署凭据</text><text x="600" y="490" font-size="21" fill="#006f59" font-weight="500">developer.inhand.com</text><path d="M546 453 H574" fill="none" stroke="#769095" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="563" font-size="13" fill="#006f59" font-weight="700">部署边界</text><text x="40" y="593" font-size="17" fill="#172d31" font-weight="400">mo-docs 仅部署 /docs/，主站目录和 /hardware-docs/ 保持独立。</text><text x="40" y="625" font-size="16" fill="#53686d" font-weight="400">测试与正式域名分别构建；校验失败或缺少配置时阻断相应发布、部署步骤。</text></g></svg>
