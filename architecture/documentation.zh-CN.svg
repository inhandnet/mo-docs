<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 360" role="img" aria-labelledby="title"><title id="title">内容来源 → 唯一的 developer 网站</title><rect width="1110" height="360" rx="16" fill="#f3f8f5"/><g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#233b34"><text x="24" y="55" font-size="28" font-weight="700">内容来源 → 唯一的 developer 网站</text><rect x="24" y="100" width="330" height="220" rx="12" fill="white" stroke="#c6dad4"/><text x="44" y="140" fill="#006f59" font-size="24" font-weight="700">mo-docs</text><text x="44" y="185" font-size="17">docs/：Markdown 与受控 MDX</text><text x="44" y="221" font-size="17">hardware/：事实、设计资料与培训</text><text x="44" y="257" font-size="17">static/：媒体和证据</text><path d="M360 210h20m-7-6 7 6-7 6" fill="none" stroke="#006f59" stroke-width="2"/><rect x="386" y="100" width="330" height="220" rx="12" fill="white" stroke="#c6dad4"/><text x="406" y="140" fill="#006f59" font-size="24" font-weight="700">developer 内容接入</text><text x="406" y="185" font-size="17">固定来源提交与文件哈希</text><text x="406" y="221" font-size="17">内容规则、路由与来源映射</text><text x="406" y="257" font-size="17">生成页面与兼容下载路径</text><path d="M722 210h20m-7-6 7 6-7 6" fill="none" stroke="#006f59" stroke-width="2"/><rect x="748" y="100" width="330" height="220" rx="12" fill="white" stroke="#c6dad4"/><text x="768" y="140" fill="#006f59" font-size="24" font-weight="700">一个 Docusaurus 网站</text><text x="768" y="185" font-size="17">统一组件、导航和搜索</text><text x="768" y="221" font-size="17">集成预览与浏览器验收</text><text x="768" y="257" font-size="17">整站发布、部署与回滚</text></g></svg>
