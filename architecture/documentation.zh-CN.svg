<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1104" role="img" aria-labelledby="title description">
<title id="title">mo-docs：从已核验内容到可发布的网站</title><desc id="description">指南与证据在源码中维护，数据更新经过审阅</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#769095"/></marker></defs>
<rect width="1120" height="1104" rx="16" fill="#f4f8f7"/>
<g font-family="Inter, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif"><text x="40" y="42" font-size="13" fill="#006f59" font-weight="700">MO / DOCUMENTATION</text><text x="40" y="92" font-size="29" fill="#172d31" font-weight="700">mo-docs：从已核验内容到可发布的网站</text><text x="40" y="124" font-size="17" fill="#53686d" font-weight="400">指南与证据在源码中维护，数据更新经过审阅</text><rect x="24" y="150" width="1072" height="392" rx="16" fill="#edf3f2" stroke="#dce6e4"/><rect x="40" y="166" width="504" height="160" rx="12" fill="#fff" stroke="#cad9d9"/><text x="64" y="208" font-size="23" fill="#172d31" font-weight="700">01  内容与证据</text><text x="64" y="251" font-size="18" fill="#172d31" font-weight="400">docs/mo-* · 共用 partial · 安全指南</text><text x="64" y="288" font-size="18" fill="#53686d" font-weight="400">板卡、镜像、命令、结果与验证边界</text><rect x="576" y="166" width="504" height="160" rx="12" fill="#fff" stroke="#cad9d9"/><text x="600" y="208" font-size="23" fill="#172d31" font-weight="700">02  公开附件</text><text x="600" y="251" font-size="18" fill="#172d31" font-weight="400">static/img · static/downloads</text><text x="600" y="288" font-size="18" fill="#53686d" font-weight="400">截图、授权素材、示例与原始证据</text><rect x="40" y="366" width="504" height="160" rx="12" fill="#fff" stroke="#cad9d9"/><text x="64" y="408" font-size="23" fill="#172d31" font-weight="700">03  数据与外部资源</text><text x="64" y="451" font-size="18" fill="#172d31" font-weight="400">GitHub Release 快照 · 上游链接</text><text x="64" y="488" font-size="18" fill="#53686d" font-weight="400">浏览器独立解析稳定镜像与校验文件</text><rect x="576" y="366" width="504" height="160" rx="12" fill="#fff" stroke="#cad9d9"/><text x="600" y="408" font-size="23" fill="#172d31" font-weight="700">04  共用文档组件</text><text x="600" y="451" font-size="18" fill="#172d31" font-weight="400">链接路由 · 表格 · 下载 · 搜索界面</text><text x="600" y="488" font-size="18" fill="#53686d" font-weight="400">33 条硬件旧地址保留参数与锚点</text><rect x="40" y="600" width="1040" height="160" rx="12" fill="#e7f3ee" stroke="#cad9d9"/><text x="64" y="642" font-size="23" fill="#172d31" font-weight="700">05  Docusaurus + Pagefind</text><text x="64" y="685" font-size="18" fill="#172d31" font-weight="400">配置、主题与环境地址 → 静态页面</text><text x="64" y="722" font-size="18" fill="#53686d" font-weight="400">本地搜索索引 · 字体许可 · 部署标记</text><rect x="40" y="800" width="1040" height="160" rx="12" fill="#e7f3ee" stroke="#cad9d9"/><text x="64" y="842" font-size="23" fill="#172d31" font-weight="700">06  验证与交付</text><text x="64" y="885" font-size="18" fill="#172d31" font-weight="400">单元测试 · 类型检查 · 浏览器与布局</text><text x="64" y="922" font-size="18" fill="#53686d" font-weight="400">审阅附件 / Pages / 分环境发布归档</text><path d="M560 546 V596" fill="none" stroke="#769095" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 764 V796" fill="none" stroke="#769095" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="1004" font-size="14" fill="#006f59" font-weight="700">独立部署边界</text><text x="40" y="1038" font-size="19" fill="#172d31" font-weight="400">/docs/ 与主站 /、硬件站 /hardware-docs/ 分别构建与部署。</text><text x="40" y="1073" font-size="17" fill="#53686d" font-weight="400">普通构建不刷新 Release 数据；开发板观察不自动代表原始发布镜像。</text></g></svg>
