<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 360" role="img" aria-labelledby="title"><title id="title">Content publication and website composition</title><rect width="1110" height="360" rx="16" fill="#f3f8f5"/><g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#233b34"><text x="24" y="55" font-size="28" font-weight="700">Content publication and website composition</text><rect x="24" y="100" width="330" height="220" rx="12" fill="white" stroke="#c6dad4"/><text x="44" y="140" fill="#006f59" font-size="24" font-weight="700">Source repository</text><text x="44" y="185" font-size="17">Topic PR → required content checks</text><text x="44" y="221" font-size="17">Admin merge → ordinary VX.Y.Z</text><text x="44" y="257" font-size="17">Content / metadata / hashes in Release</text><path d="M360 210h20m-7-6 7 6-7 6" fill="none" stroke="#006f59" stroke-width="2"/><rect x="386" y="100" width="330" height="220" rx="12" fill="white" stroke="#c6dad4"/><text x="406" y="140" fill="#006f59" font-size="24" font-weight="700">developer RC</text><text x="406" y="185" font-size="17">Freeze selected source versions</text><text x="406" y="221" font-size="17">Validate and build the complete site</text><text x="406" y="257" font-size="17">Publish and verify the test platform</text><path d="M722 210h20m-7-6 7 6-7 6" fill="none" stroke="#006f59" stroke-width="2"/><rect x="748" y="100" width="330" height="220" rx="12" fill="white" stroke="#c6dad4"/><text x="768" y="140" fill="#006f59" font-size="24" font-weight="700">developer final</text><text x="768" y="185" font-size="17">Explicitly inherit accepted RC sources</text><text x="768" y="221" font-size="17">Build for the production destination</text><text x="768" y="257" font-size="17">Verify deployment; retain rollback</text></g></svg>
