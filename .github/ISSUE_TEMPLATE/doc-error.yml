name: Documentation error
description: Report a wrong, missing, unclear or outdated part of the documentation.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for problems in the documentation. For questions about
        using a board, ask in the [community forum](https://community.inhand.com).
  - type: input
    id: page
    attributes:
      label: Page
      description: The page URL or source file. The "Report an issue" button on each page fills this in.
      placeholder: docs/mo62a/getting-started/index.md
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of problem
      options:
        - Wrong information
        - Missing information
        - Unclear wording
        - Outdated for the current image
        - Broken link or image
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the text or describe the problem.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
      description: Optional. If you know the right content, write it here, or open a pull request with the "Edit this page" button.
  - type: input
    id: image-version
    attributes:
      label: Image version
      description: Optional. The image version on your board, if the problem depends on it.
      placeholder: V1.1.0
