name: build
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mo-docs-content-${{ github.ref }}
  cancel-in-progress: true
jobs:
  content:
    name: validate-content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate content, media and downloadable resources
        run: npm test
