name: build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mo-docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: validate-and-build-${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mode: public
            preview: '0'
            base: '/docs/'
          - mode: office-preview
            preview: '1'
            base: '/'
    env:
      SITE_ENVIRONMENT: review-${{ matrix.mode }}
      DOCS_PREVIEW: ${{ matrix.preview }}
      DOCS_BASE_URL: ${{ matrix.mode == 'public' && vars.WEBSITE_BASE_URL || matrix.base }}
      DOCS_SITE_URL: ${{ vars.WEBSITE_SITE_URL || 'https://developer.inhand.online' }}
      DEVELOPER_PORTAL_URL: ${{ vars.DEVELOPER_PORTAL_URL || 'https://developer.inhand.online' }}
      HARDWARE_URL: ${{ vars.HARDWARE_URL || 'https://developer.inhand.online/hardware-docs' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check site components
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Verify browser navigation and search
        run: npm run test:browser

      - name: Upload static site
        uses: actions/upload-artifact@v7
        with:
          name: mo-docs-${{ matrix.mode }}-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 14
