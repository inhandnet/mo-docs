name: release
on:
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Ordinary content version (validation/package only)'
        required: true
        default: V1.0.2
        type: string
permissions:
  contents: read
concurrency:
  group: mo-docs-release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false
env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
jobs:
  build:
    name: validate-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate ordinary version, annotated tag and mainline ancestry
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/validate-release-version.mjs "$VERSION"
          SOURCE_COMMIT=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" = push ]; then
            test "$(git cat-file -t "refs/tags/$VERSION")" = tag
            test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$SOURCE_COMMIT"
          fi
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/master
          node scripts/check-commit-msg.mjs --revs "$SOURCE_COMMIT"
      - run: npm ci
      - run: npm test
      - name: Package versioned content with file hashes
        run: node scripts/package-release.mjs "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: mo-docs-content-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  publish:
    name: publish-github-release
    if: github.event_name == 'push' && github.repository == 'inhandnet/mo-docs'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mo-docs-content-${{ env.VERSION }}
          path: dist/
      - name: Create the complete content release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$VERSION" dist/* \
            --verify-tag --notes-file dist/release-notes.md \
            --title "$VERSION" --prerelease=false --draft
          gh release edit "$VERSION" --draft=false
