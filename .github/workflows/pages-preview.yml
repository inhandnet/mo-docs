name: pages-preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mo-docs-pages-preview
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read GitHub Pages deployment URL
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Validate and build preview
        run: npm run check
        env:
          DOCS_PREVIEW: '1'
          DOCS_SITE_URL: ${{ steps.pages.outputs.origin }}
          DOCS_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          DEVELOPER_PORTAL_URL: ${{ vars.DEVELOPER_PORTAL_URL || 'https://www.inhand.com/developer' }}
      - run: npx playwright install --with-deps chromium
      - name: Verify preview navigation and search
        run: npm run test:browser
        env:
          DOCS_PREVIEW: '1'
          DOCS_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          DEVELOPER_PORTAL_URL: ${{ vars.DEVELOPER_PORTAL_URL || 'https://www.inhand.com/developer' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
