      <circle cx="484" cy="29" r="23" class="signal"/><text x="484" y="30" class="pin">19</text>
      <circle cx="550" cy="29" r="23" class="ground"/><text x="550" y="30" class="pin">20</text>
      <text x="586" y="39" class="label">GND</text>
    </g>
    <g transform="translate(0 840)">
      <rect x="32" width="928" height="58" rx="9" class="row"/>
