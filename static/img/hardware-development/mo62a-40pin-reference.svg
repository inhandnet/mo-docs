      <text x="448" y="50" class="alt" text-anchor="end">ALT · SPI0_D1 / MISO</text>
      <circle cx="484" cy="29" r="23" class="signal"/><text x="484" y="30" class="pin">21</text>
      <circle cx="550" cy="29" r="23" class="signal"/><text x="550" y="30" class="pin">22</text>
      <text x="586" y="39" class="label">GPIO0_14</text>
    </g>
    <g transform="translate(0 900)">
      <text x="448" y="25" class="label" text-anchor="end">GPIO1_17</text>
      <text x="448" y="50" class="alt" text-anchor="end">ALT · SPI0_CLK</text>
      <circle cx="484" cy="29" r="23" class="signal"/><text x="484" y="30" class="pin">23</text>
      <circle cx="550" cy="29" r="23" class="signal"/><text x="550" y="30" class="pin">24</text>
      <text x="586" y="25" class="label">GPIO1_15</text>
      <text x="586" y="50" class="alt">ALT · SPI0_CS0</text>
    </g>
    <g transform="translate(0 960)">
      <rect x="32" width="928" height="58" rx="9" class="row"/>
      <text x="448" y="39" class="label" text-anchor="end">GND</text>
      <circle cx="484" cy="29" r="23" class="ground"/><text x="484" y="30" class="pin">25</text>
      <circle cx="550" cy="29" r="23" class="signal"/><text x="550" y="30" class="pin">26</text>
