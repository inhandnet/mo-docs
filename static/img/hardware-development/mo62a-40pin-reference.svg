      <circle cx="484" cy="29" r="23" class="signal"/><text x="484" y="30" class="pin">3</text>
      <circle cx="550" cy="29" r="23" class="power5"/><text x="550" y="30" class="pin">4</text>
      <text x="586" y="39" class="label">5 V power</text>
