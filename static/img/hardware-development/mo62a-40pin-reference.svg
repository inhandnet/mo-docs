  <g id="notes">
    <rect x="990" y="240" width="338" height="238" rx="14" fill="#fff3e8"/>
    <text x="1010" y="280" class="card-title">Before wiring</text>
    <text x="1010" y="321" class="card-text">
      <tspan x="1010">Power off the board.</tspan>
      <tspan x="1010" dy="34">Locate physical pin 1</tspan>
      <tspan x="1010" dy="34">on the actual board.</tspan>
      <tspan x="1010" dy="40" font-weight="700">No 5 V on signal pins.</tspan>
    </text>
    <rect x="990" y="496" width="338" height="390" rx="14" fill="#eaf5f2"/>
    <text x="1010" y="536" class="card-title">Verified loopbacks</text>
    <text x="1010" y="577" class="card-text">
      <tspan x="1010" font-weight="700">GPIO · pins 7 ↔ 11</tspan>
      <tspan x="1010" dy="33">GPIO0_39 ↔ GPIO1_23</tspan>
      <tspan x="1010" dy="49" font-weight="700">UART5 · pins 8 ↔ 10</tspan>
      <tspan x="1010" dy="33">TXD ↔ RXD</tspan>
      <tspan x="1010" dy="49" font-weight="700">PWM · pins 33 → 35</tspan>
      <tspan x="1010" dy="33">EHRPWM0_A output</tspan>
      <tspan x="1010" dy="33">to GPIO0_91 input</tspan>
      <tspan x="1010" dy="44">Use the matching mode.</tspan>
    </text>
    <rect x="990" y="904" width="338" height="210" rx="14" fill="#f2edf8"/>
    <text x="1010" y="944" class="card-title">Pins 27 / 28</text>
    <text x="1010" y="985" class="card-text">
      <tspan x="1010">Camera I²C reserved.</tspan>
      <tspan x="1010" dy="34">Not general GPIO.</tspan>
      <tspan x="1010" dy="42">Pin 27: SDA</tspan>
      <tspan x="1010" dy="34">Pin 28: SCL</tspan>
    </text>
    <rect x="990" y="1132" width="338" height="306" rx="14" fill="#f1f6f7"/>
    <text x="1010" y="1172" class="card-title">Read the labels</text>
    <text x="1010" y="1213" class="card-text">
      <tspan x="1010">GPIO names identify</tspan>
      <tspan x="1010" dy="34">the SoC signal.</tspan>
      <tspan x="1010" dy="42">ALT needs the correct</tspan>
      <tspan x="1010" dy="34">pinmux / overlay.</tspan>
      <tspan x="1010" dy="42">Pin 32: EHRPWM0_B</tspan>
      <tspan x="1010" dy="34">Pin 33: EHRPWM0_A</tspan>
    </text>
  </g>
  <path d="M32 1464H1328" stroke="#c9d8df" stroke-width="2"/>
  <text x="32" y="1502" class="small">Source: Mo62A SDK README and AM62A7 board DTS / pinmux. GPIO, UART5 and PWM loopbacks: board-tested.</text>
  <text x="32" y="1537" class="small">Physical numbering is fixed; Linux gpiochip / PWM device numbers must be checked on the running image.</text>
  <text id="schematic-reference" x="32" y="1568" class="small">Schematic reference: J6; match USER EXPN and physical pin 1 on your board.</text>
</svg>
