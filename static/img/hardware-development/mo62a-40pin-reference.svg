<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1580" viewBox="0 0 1360 1580" role="img" aria-labelledby="title desc">
  <title id="title">Mo 62A J6 40-pin expansion header — physical-pin reference</title>
  <desc id="desc">Twenty rows of odd and even physical pin numbers, with SoC GPIO signal names and optional peripheral functions. This is a numbered reference, not the physical orientation of the board. Pins 27 and 28 are reserved for the camera I2C bus. All GPIO signals use 3.3-volt logic. Never apply 5 volts to a signal pin.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #183342; }
    .title { font-size: 40px; font-weight: 700; }
    .subtitle { font-size: 25px; }
    .small { font-size: 21px; }
    .label { font-size: 27px; font-weight: 600; }
    .alt { font-size: 21px; fill: #49616e; }
    .pin { font-size: 24px; font-weight: 700; fill: white; text-anchor: middle; dominant-baseline: middle; }
    .card-title { font-size: 27px; font-weight: 700; }
    .card-text { font-size: 24px; }
    .signal { fill: #167568; }
    .power3 { fill: #a65d00; }
    .power5 { fill: #b53a32; }
    .ground { fill: #4a5964; }
    .reserved { fill: #7950a5; }
    .row { fill: #f1f6f7; }
  </style>
  <rect width="1360" height="1580" rx="20" fill="#fff"/>
  <text x="32" y="57" class="title">Mo 62A · J6 / USER EXPN</text>
  <text x="32" y="99" class="subtitle">40-pin reference — physical pin numbers, not BCM GPIO numbers</text>
  <text x="32" y="136" class="subtitle">Numbered schematic only. This drawing does not show the board's physical orientation.</text>

  <g transform="translate(45 178)">
    <circle r="11" class="power3"/><text x="21" y="8" class="small">3.3 V power</text>
    <circle cx="218" r="11" class="power5"/><text x="239" y="8" class="small">5 V power</text>
    <circle cx="414" r="11" class="ground"/><text x="435" y="8" class="small">Ground</text>
    <circle cx="590" r="11" class="signal"/><text x="611" y="8" class="small">3.3 V signal</text>
    <circle cx="814" r="11" class="reserved"/><text x="835" y="8" class="small">Reserved camera I²C</text>
  </g>
  <text x="32" y="224" class="small">SoC signal / optional function</text>
  <text x="484" y="224" class="small" text-anchor="middle">ODD</text>
  <text x="550" y="224" class="small" text-anchor="middle">EVEN</text>
  <text x="590" y="224" class="small">SoC signal / optional function</text>

