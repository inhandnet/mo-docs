<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1840 1640" width="1840" height="1640" role="img" aria-labelledby="title desc">
  <title id="title">Mo62A hardware blocks — English schematic reference</title>
  <desc id="desc">English reference redrawn from sheet 1 of MO_62A_S_MB_V11-260426.pdf. It reproduces the source block connections, not a verified bill of materials. Consult the original PDF. J5 exposes Ethernet transformer taps and requires an external PoE powered-device circuit. The EEPROM part labels differ between sheets 1 and 17.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <style>
      svg { max-width: 100%; height: auto; background: #fff; }
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b42; }
      .heading { font-size: 34px; font-weight: 700; }
      .notice { font-size: 24px; font-weight: 700; }
      .node { fill: #edf5eb; stroke: #5c7d57; stroke-width: 2; rx: 8; }
      .port { fill: #fff2e9; stroke: #a76e48; stroke-width: 2; rx: 8; }
      .soc { fill: #e7f0fd; stroke: #59799f; stroke-width: 2; rx: 10; }
      .name { font-size: 25px; font-weight: 700; text-anchor: middle; }
      .detail { font-size: 23px; text-anchor: middle; }
      .small { font-size: 20px; text-anchor: middle; }
      .wire { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .signal { font-size: 19px; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 7; stroke-linejoin: round; }
      .note { font-size: 21px; }
    </style>
  </defs>
