  <path d="M40 1410H1800" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="1446" class="note">Source: MO_62A_S_MB_V11-260426.pdf, sheet 1 (title-block revision: V1.0). This is not an original schematic image.</text>
  <text x="40" y="1480" class="note">[1] Block names, signal labels and arrows follow the source, including WUKP_I2C0, PWM × 3 and Voltage Isolation.</text>
  <text x="40" y="1513" class="note">These labels do not establish enabled pinmux, simultaneous functions, or galvanic isolation. Consult the detailed sheets and pin table.</text>
  <text x="40" y="1547" class="note">[2] Sheet 1 labels the EEPROM M24M02E; sheet 17 labels it BL24C02F. The fitted part is not verified by this reference.</text>
  <text x="40" y="1581" class="note">[3] J5 exposes Ethernet transformer center taps, not 5 V or GPIO. A matching external PoE PD / conversion board is required.</text>
  <text x="40" y="1614" class="note">PoE requires verified wiring and a regulated 5 V board supply; the source label RJ45+PoE is not a compatibility or certification claim.</text>
</svg>
