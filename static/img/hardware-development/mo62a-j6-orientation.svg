    <g data-physical-pin="37" class="pin"><circle cx="1646" cy="268" r="29"/><text x="1646" y="268" class="pin-number">37</text></g>
    <g data-physical-pin="39" class="pin pin-end"><circle cx="1718" cy="268" r="29"/><text x="1718" y="268" class="pin-number">39</text></g>
