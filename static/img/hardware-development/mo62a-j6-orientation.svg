<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="390" viewBox="0 0 1800 390" role="img" aria-labelledby="title description">
  <title id="title">J6 physical pin orientation</title>
  <desc id="description">Viewed from the component side, with the USB and Ethernet sockets on the right. The upper row faces the outer board edge and runs from pin 2 at the left to pin 40 at the right. The lower row faces the board centre and runs from pin 1 at the left to pin 39 at the right. This diagram shows physical pin numbers, not GPIO numbers. Disconnect power and check the actual board's pin-1 mark before wiring.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #17363e; }
    .heading { font-size: 40px; font-weight: 700; }
    .note { font-size: 29px; fill: #4b6369; }
    .row-label { font-size: 29px; font-weight: 700; }
    .pin circle { fill: white; stroke: #9ebabe; stroke-width: 2; }
    .pin-number { font-size: 32px; text-anchor: middle; dominant-baseline: central; }
    .pin-end circle { fill: #087b83; stroke: #087b83; }
    .pin-end .pin-number { fill: white; font-weight: 700; }
  </style>
  <rect width="1800" height="390" fill="white"/>
  <rect x="2" y="2" width="1796" height="386" rx="18" fill="#f3f8f8" stroke="#d0e2e4" stroke-width="2"/>
  <text x="36" y="54" class="heading">J6 physical pin orientation</text>
  <text x="36" y="101" class="note">Component side · USB / Ethernet to the right</text>
  <text x="36" y="188" class="row-label">Outer edge</text>
  <text x="36" y="279" class="row-label">Board centre</text>
  <g id="outer-row" aria-label="Upper row: even physical pins, left to right">
